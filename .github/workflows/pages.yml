name: Publicar Jenga Salud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar sitio estático
        run: python3 .jenga-build/package-site.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos públicos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
