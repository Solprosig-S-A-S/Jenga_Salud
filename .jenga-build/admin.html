<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Respuestas · SOLPROSIG</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui;margin:0;background:#edf5ef;color:#183f36}main{max-width:1100px;margin:40px auto;padding:24px}section{background:white;padding:26px;border-radius:20px;margin-bottom:20px}h1{margin-top:0;font-size:28px}label{display:block;margin:12px 0 5px}input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #b7d2c4}input{width:100%;max-width:420px;display:block}button{background:#087c78;color:white;cursor:pointer;margin:14px 8px 0 0}button:disabled{opacity:.5;cursor:wait}a{color:#07565b}.filters{display:flex;flex-wrap:wrap;gap:16px}.filters input{width:190px}.scroll{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid #dce8dd;vertical-align:top;min-width:110px;white-space:pre-wrap;overflow-wrap:anywhere}td:last-child{min-width:250px}#status{min-height:24px;white-space:pre-wrap}[hidden]{display:none!important}
</style></head><body><main>
<a href="index.html">← Volver al juego</a><section><h1>Respuestas del juego</h1><p>Acceso exclusivo para administradores autorizados.</p>
<form id="login"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button id="signIn">Ingresar</button></form>
<div id="account" hidden><span id="identity"></span> <button id="signOut" type="button">Cerrar sesión</button></div><p id="status" role="status" aria-live="polite"></p></section>
<section id="reports" hidden><h2>Descargar respuestas</h2><div class="filters"><div><label for="from">Desde (fecha UTC)</label><input id="from" type="date"></div><div><label for="to">Hasta (fecha UTC)</label><input id="to" type="date"></div><div><label for="alias">Alias exacto (opcional)</label><input id="alias" maxlength="30"></div></div>
<button id="load" type="button">Consultar</button><button id="download" type="button" disabled>Descargar Excel (.xlsx)</button><p id="count"></p><div class="scroll"><table><thead><tr><th>Fecha (UTC)</th><th>Alias</th><th>Sala / modo</th><th>Pregunta</th><th>Respuesta</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>/* ADMIN_SCRIPTS */</script></body></html>
